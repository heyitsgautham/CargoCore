[tool.ruff]
line-length = 88
target-version = "py312"
extend-exclude = ["alembic", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = [
    "E501",  # long lines are left to the formatter
    "B008",  # FastAPI declares dependencies as Depends() defaults
    "E711",  # SQLAlchemy filters need `== None` to build IS NULL
    "E712",  # SQLAlchemy filters need `== True` to build the SQL comparison
    "SIM102",  # nested guards stay apart where each one carries its own comment
]

[tool.black]
line-length = 88
target-version = ["py312"]
exclude = '''
/(
    alembic
  | \.git
  | \.venv
)/
'''

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests/unit", "tests/contract", "tests/integration", "tests/test_ai", "tests/test_auth", "tests/test_customer", "tests/test_orders", "tests/flows"]
filterwarnings = [
    # starlette 0.37.x still uses `import multipart` internally; fixed in a later release
    "ignore:Please use.*python_multipart:PendingDeprecationWarning",
]

[tool.coverage.run]
source = ["app"]
branch = true
# SQLAlchemy async runs ORM work inside greenlets, which hides those lines from the default tracer.
concurrency = ["thread", "greenlet"]

[tool.coverage.report]
# Measured at 71% line and branch coverage with every suite under testpaths.
# Raise it as tests land.
fail_under = 70
skip_covered = true
