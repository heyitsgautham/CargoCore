[tool.ruff]
line-length = 88
target-version = "py312"
exclude = ["alembic"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.black]
line-length = 88
target-version = ["py312"]
exclude = '''
/(
    alembic
  | \.git
  | \.venv
)/
'''

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests/unit", "tests/contract", "tests/integration"]
filterwarnings = [
    # starlette 0.37.x still uses `import multipart` internally; fixed in a later release
    "ignore:Please use.*python_multipart:PendingDeprecationWarning",
]
