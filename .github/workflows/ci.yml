name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint, tests, audit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: logistics_user
          POSTGRES_PASSWORD: logistics_pass
          POSTGRES_DB: logistics_db_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U logistics_user -d logistics_db_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # conftest.py swaps /logistics_db for /logistics_db_test before connecting.
      DATABASE_URL: postgresql+asyncpg://logistics_user:logistics_pass@localhost:5432/logistics_db
      SECRET_KEY: ci-only-secret-key-that-is-at-least-32-bytes-long
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: File size limits
        run: python ../scripts/check_file_size.py

      - name: Tests with coverage
        run: pytest --cov --cov-report=term --cov-report=xml

      - name: Dependency audit
        run: pip-audit -r requirements.txt --no-deps --disable-pip

  frontend:
    name: Frontend (lint, tests, build, audit)
    runs-on: ubuntu-latest
    # The web app is the `frontend` workspace of the root npm project, so every step runs from the root.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Test
        run: npm run test:coverage

      - name: Build
        run: npm run build

      - name: Dependency audit
        run: npm audit --audit-level=high

  docker:
    name: Docker images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate compose file
        run: docker compose config --quiet

      - name: Build images
        run: docker compose build

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            | tar -xz -C /usr/local/bin gitleaks

      - name: Scan full history
        run: gitleaks git --redact --config .gitleaks.toml .
